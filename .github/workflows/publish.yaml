name: brew pr-pull
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
permissions: {}
defaults:
  run:
    shell: bash -xeuo pipefail {0}
jobs:
  pr-pull:
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
    - name: Set up Homebrew
      uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      with:
        token: ${{github.token}}

    - name: Set up git
      id: git_setup
      uses: Homebrew/actions/git-user-config@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1

    - name: Pull bottles
      env:
        HEAD_SHA: ${{inputs.head_sha}}
        HOMEBREW_GIT_COMMITTER_EMAIL: ${{steps.git_setup.outputs.email}}
        HOMEBREW_GIT_COMMITTER_NAME: ${{steps.git_setup.outputs.name}}
        HOMEBREW_GITHUB_API_TOKEN: ${{github.token}}
        PULL_REQUEST: ${{inputs.pull_request}}
      run: brew pr-pull --debug --tap="${GITHUB_REPOSITORY}" ${HEAD_SHA:+--head-sha="${HEAD_SHA}"} "${PULL_REQUEST}"

    - name: Push commits
      uses: Homebrew/actions/git-try-push@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      with:
        branch: main

    - name: Delete branch
      if: github.event.pull_request.head.repo.fork == false
      run: git push --delete origin "${GITHUB_HEAD_REF}"
